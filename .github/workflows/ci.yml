name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: go test -race ./...
      - run: npm test
      - run: npm run build
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: agentops-ci
          POSTGRES_DB: agentops
        options: >-
          --health-cmd "pg_isready -U postgres -d agentops"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      AGENTOPS_TEST_DATABASE_URL: postgresql://postgres:agentops-ci@127.0.0.1:5432/agentops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run test:postgres
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dashboard
      - run: go test -race ./...
      - run: docker build --target control -t agentops-control:ci -f deploy/Containerfile .
