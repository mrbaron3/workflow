# ISSUE-0009 の人間 WHAT 確定（adopt --contract）。Analyst 添付 draft（brief 忠実性）は使わない:
# 忠実性は ISSUE-0004 で released 済みで、⑥の grounded 証拠が示した真の失敗クラスは
# 「lineage の誤帰属」— Analyst が criterionId 一致（lens 跨ぎ含む）で『残存』を主張し、
# 実際は (a) 同 id で別内容（偽陽性）(b) id を移動した真の残存（偽陰性）(c) lens 跨ぎ一致
# の全てが ISSUE-0007 の実データに存在する。lineage は意味判断なのでレビュア（セッション）に
# 帰属させ、orchestrator/Analyst は attested な判定だけを機械的に集計する（ADR-0004 の境界）。
productGoal: >-
  再レビューの finding lineage（persisted / new）をレビュア自身の attested 判断として記録し、
  Analyst の「repair brief 不着」判定と計器を誤帰属から守る（間違った改善テーマの採用を防ぐ）。
userStory: >-
  as the operator I want 修復後の再レビューで各指摘が「残存」か「新規」かをレビュアが判定・記録し、
  Analyst がその attested 判定のみを根拠に brief 失敗を報告するようにしたい。
scope:
  include: ['apps/agentops/src/**', 'apps/agentops/test/**']
  exclude: ['apps/agentops/test/acceptance-harness/**']
acceptanceCriteria:
  - id: AC-LINEAGE-001
    severity: blocker
    behavior: >-
      再レビュー（attempt>1）の観点プロンプトには、同観点の直前 attempt の findings が提示され、
      レビュアに各 finding の lineage 判定（persisted＝同じ問題が残っている / new＝今回新たに
      見つけた）を義務づける。prior findings が無い場合（attempt 1）のプロンプトは従来と不変。
    verification:
      method: unit_test
      expected:
        - "perspectivePrompt に prior findings を渡すと、各 prior finding の内容（criterionId・observed）と persisted/new 判定の指示がプロンプトに含まれる"
        - "prior findings 無しでは lineage 節がプロンプトに現れない（attempt 1 従来不変）"
  - id: AC-LINEAGE-002
    severity: blocker
    behavior: >-
      レビュアが findings.json の各 finding に書いた lineage（'persisted' | 'new'）は zod 検証を
      通って EvalRun.findings まで機械可読に保存される（store＝SoT）。不正な lineage 値は拒否され、
      欠落は許容される（legacy 互換）。欠落を silent に resolved / persisted のどちらにも倒さない。
    verification:
      method: unit_test
      expected:
        - "parsePerspectiveFindings が finding.lineage='persisted'/'new' を保存し、不正値を拒否する"
        - "lineage 欠落の finding は従来どおり受理され、lineage は付与されない"
  - id: AC-LINEAGE-003
    severity: major
    behavior: >-
      Analyst の「repair brief 不着（failed to land）」判定は lineage='persisted' と attested された
      finding のみを根拠とする。attempt>1 の findings が全て lineage='new' の場合は brief 失敗と
      報告しない（review depth として別報告してよい）。lineage 未記録（legacy）の再レビューは
      brief 失敗の根拠にしない（criterionId 一致による推測をしない）。
    verification:
      method: unit_test
      expected:
        - "attempt>1 の findings が全て lineage='new' のとき failed-to-land 提案が出ない"
        - "lineage='persisted' の finding があるときだけ提案が出て、根拠には persisted のみが数えられる（criterionId が attempt 1 と不一致でも）"
        - "lineage 未記録の再レビュー findings だけでは提案が出ない"
redLines:
  - "apps/agentops/test/acceptance-harness/** に触れない（ハーネス所有の独立採点者・protectedPaths）"
  - "orchestrator / Analyst が finding 内容の意味比較や criterionId 一致で lineage を推測しない — lineage はレビュアの attested 判断のみ"
  - "既存 EvalRun / findings の記録を書き換えない（additive スキーマ・legacy 欠落許容）"
  - "repairSuccessRate（収束率）の意味を変えない"
  - "合格基準（既存テスト）を弱体化しない"
dependsOnSystem:
  - ARCH-execution-006
  - ARCH-execution-015
