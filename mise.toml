# agentopsctl の実行入口。
#
# 素で叩くと毎回こうなる:
#   set -a; . ~/.config/agentops/env; set +a
#   mise exec go@1.24.0 -- go run ./cmd/agentopsctl start --mode MONITOR_ONLY --build
# 前置の正体は「operator の env を全部 export する」「Go を固定版で解決する」の 2 つで、
# どちらも mise が持っている機能なので task へ畳む。ツールは [tools] が解決するので
# `mise exec go@1.24.0 --` は不要になる。
#
# 秘密を含む env ファイルの在処だけは個人差があるので、追跡しない mise.local.toml に置く。
# mise.local.toml.example をコピーして使う。

# サプライチェーン対策。exact version 固定に加えて mise.lock へ実体を固定する
# （グローバル config の lockfile 既定はプロジェクト側の mise.toml で効かせる想定）。
[settings]
lockfile = true

[tools]
go = "1.24.0"

# 必要な変数が揃っているかを先に見る。mise.local.toml を置き忘れると全変数が空のまま
# agentopsctl まで進み、どの層で失敗したのか分かりにくいため、入口で名前を挙げて落とす。
[tasks."env:check"]
description = "agentopsctl に必要な環境変数が解決できているか確かめる"
run = '''
missing=""
for name in \
  AGENTOPS_GITHUB_APP_ID \
  AGENTOPS_GITHUB_APP_INSTALLATION_ID \
  AGENTOPS_GITHUB_APP_SLUG \
  AGENTOPS_GITHUB_APP_OWNER \
  AGENTOPS_GITHUB_APP_PRIVATE_KEY_FILE \
  AGENTOPS_MONITOR_REPOSITORIES \
  AGENTOPS_POSTGRES_PASSWORD \
  AGENTOPS_CONTROL_DB_PASSWORD \
  AGENTOPS_TRIAGE_DB_PASSWORD \
  AGENTOPS_RUNNER_DB_PASSWORD \
  AGENTOPS_CONTROL_TOKEN \
  AGENTOPS_DASHBOARD_BOOTSTRAP_TOKEN \
  AGENTOPS_GITHUB_WEBHOOK_SECRET
do
  if [ -z "$(printenv "$name" || true)" ]; then
    missing="$missing $name"
  fi
done
if [ -n "$missing" ]; then
  echo "解決できていない環境変数:$missing" >&2
  echo "mise.local.toml が無い可能性がある。mise.local.toml.example をコピーし、env ファイルの絶対パスを指すこと。" >&2
  exit 1
fi
# 値は出さない。allowlist だけは黙って 1 リポジトリになっていても気づけないので見せる。
echo "env: 必須 13 件を解決した"
echo "monitor: $AGENTOPS_MONITOR_REPOSITORIES"
echo "runner:  ${AGENTOPS_RUNNER_REPOSITORIES:-(未設定 — ACTIVE では必須)}"
'''

[tasks."status"]
description = "topology の現状を読む（読み取り専用）"
depends = ["env:check"]
run = "go run ./cmd/agentopsctl status"

[tasks."status:json"]
description = "topology の現状を JSON で読む"
depends = ["env:check"]
run = "go run ./cmd/agentopsctl status --json"

# 例: mise run progress -- mrbaron3/forma#8
[tasks."progress"]
description = "Issue 単位の現在工程・worktree・次の gate・blocker を読む"
depends = ["env:check"]
run = "go run ./cmd/agentopsctl progress"

# 例: mise run worktree -- --diff mrbaron3/forma#8
# 再開/手動修正: mise run worktree -- --shell mrbaron3/forma#8
[tasks."worktree"]
description = "Issue の隔離 worktree を確認・再開する（--diff / --shell）"
depends = ["env:check"]
run = "go run ./cmd/agentopsctl worktree"

# --request-id は渡さない。省略時は commandID() が <operation>-<unixnano>-<pid> を
# 生成する（cmd/agentopsctl/main.go）。固定値をここへ焼き込むと再実行が前回の要求と
# 衝突するので、自動生成に任せるのが正しい。
[tasks."monitor"]
description = "MONITOR_ONLY で起動する（観測のみ。AI 分類も label/comment の mutation もしない）"
depends = ["env:check"]
run = "go run ./cmd/agentopsctl start --mode MONITOR_ONLY --build"

[tasks."active"]
description = "ACTIVE へ進める（provider 資格情報と development runner が加わる）"
depends = ["env:check"]
run = "go run ./cmd/agentopsctl start --mode ACTIVE"

[tasks."drain"]
description = "graceful drain（lease と attempt を落としきる）"
depends = ["env:check"]
run = "go run ./cmd/agentopsctl drain"

[tasks."stop"]
description = "OFF まで落とす"
depends = ["env:check"]
run = "go run ./cmd/agentopsctl stop"

# 追加フラグは `mise run logs -- --component triage --follow` のように -- の後ろへ置く。
[tasks."logs"]
description = "コンポーネントのログを読む（既定は control）"
depends = ["env:check"]
run = "go run ./cmd/agentopsctl logs"

[tasks."open"]
description = "Dashboard を開く"
depends = ["env:check"]
run = "go run ./cmd/agentopsctl open"
