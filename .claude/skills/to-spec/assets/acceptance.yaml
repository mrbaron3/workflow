# <機能名> 受け入れ検証 (acceptance.yaml)
#
# grader 向けの verification + severity を spec.md から分離した SoT。
# spec.md の各受け入れ基準シナリオに付した AC-ID をキーに join する。両ファイルとも同じ spec
# ディレクトリの repo 内に置き Git 追跡する。
#
# 役割分担:
#   - spec.md         : 人間が受け入れ基準を Given/When/Then（観測可能な WHAT）で書く（人間可読）
#   - acceptance.yaml : AI が協業で severity + verification（method + expected）を提案 → 人間が確定（grader 向け）。
#                       構造化メタ（dependsOn / supersedes）もここに置く——spec.md を `[AC-…]` の括弧で汚すと
#                       被覆 lint・署名パーサと衝突するため、構造データは構造ファイル側に集約する。
#
# 制約:
#   - severity は blocker | major | minor。blocking 判定（落ちたら出荷不可か）に使う。
#   - method は自動採点メソッドのみ。manual は禁止（自動採点不可な要件はチャットで人間に指摘し人間が判断）。
#     使える method: build | typecheck | unit_test | api_test | db_state_check |
#                    playwright | secrets_scan | scope_check | llm_rubric
#   - spec.md の全 AC-ID が、ここに過不足なく対応する（被覆。双方向一致をコードが強制）。
#   - expected は grader が実際に判定できる具体値を最低 1 行。

# dependsOn（任意・spec 全体）: この spec が参照する system 層の要素 id（複製禁止・参照のみ）。
# 形式: LANG/DOM/ARCH/DATA/CONTRACT-<ctx>-NNN または NFR-NNN。署名時に systemRefs として版固定される。
# greenfield（system 層が未 seed）なら空でよい。書く場合のみ形式をコードが検査する。
# dependsOn:
#   - DOM-<ctx>-NNN
#   - DATA-<ctx>-NNN

verifications:
  AC-<FEATURE>-001:
    severity: blocker
    method: playwright
    expected:
      - "<具体的・検証可能な期待値。例: QR 表示後に該当決済が PENDING 状態で開始する>"
    # supersedes（任意・この AC が置換する過去 AC-ID）: 現在仕様を畳む鍵（DOC_LIFECYCLE）。
    # 過去の AC-ID のみ・この spec 自身の AC は不可。書く場合のみ形式をコードが検査する。
    # supersedes: [AC-<OLDFEATURE>-NNN]

  AC-<FEATURE>-002:
    severity: major
    method: api_test
    expected:
      - "<例: 金額不一致の着金を反映後、警告が記録され二重計上されない>"

  AC-<FEATURE>-003:
    severity: major
    method: db_state_check
    expected:
      - "<例: 切断中の着金注入後、状態遷移が 1 度だけ実行され重複検知が吸収される>"
