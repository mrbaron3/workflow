# <機能名> 受け入れ検証 (acceptance.yaml)
#
# ADR-0001 D15（O1 反転）により、grader 向けの verification を spec.md から分離した SoT。
# spec.md の acceptanceCriteria[].id をキーに join する。両ファイルとも同じ epic ディレクトリの
# repo 内に置き Git 追跡する。
#
# 役割分担:
#   - spec.md         : 人間が behavior（観測可能な WHAT）を書く（人間可読）
#   - acceptance.yaml : AI が協業で verification（method + expected）を提案 → 人間が確定（grader 向け）
#
# 制約:
#   - method は自動採点メソッドのみ。manual は禁止（自動採点不可は manual-requirements.md へ）。
#     使える method: build | typecheck | unit_test | api_test | db_state_check |
#                    playwright | secrets_scan | scope_check | llm_rubric
#   - spec.md の全 AC-ID が、ここに過不足なく対応する（被覆）。新 AC を足したら必ずここにも追加。
#   - expected は grader が実際に判定できる具体値を最低 1 行。

verifications:
  AC-<FEATURE>-001:
    method: playwright
    expected:
      - "<具体的・検証可能な期待値。例: 申請成功後の遷移先 URL が /portfolio である>"

  AC-<FEATURE>-010:
    method: api_test
    expected:
      - "<例: 失敗イベント注入後、GET /balance が減算前の値に戻っている>"

  AC-<FEATURE>-011:
    method: db_state_check
    expected:
      - "<例: 遅延着金注入後、レコード status が Completed かつ二重減算されていない>"
