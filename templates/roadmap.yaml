# Roadmap seed template — copy to your own file and pass with `agentops plan --seed <file>`.
# Validated against the SeedRoadmap schema (src/planning/planner.ts) at plan time.
#
# ⚠️ 旧形式（ADR-0001 で置換予定）: この seed は contract を全埋め込みする旧モデル。
# 新設計では spec.md（behavior）+ acceptance.yaml（verification）+ M05 resolve に置換される
# （draft/_spec/modules/authoring-layer.md §9）。下記の contract.acceptanceCriteria[].verification は
# 旧 O1 形式（embedded・manual 可）であり、新形式では acceptance.yaml に分離し manual を排する。
# 新規機能は feature-spec.md / acceptance.yaml テンプレートを使うこと。

vision: "<one sentence describing the product>"
principles:
  - "<a non-negotiable principle that constrains every issue>"

epics:
  - id: EPIC-01
    title: "<epic title>"
    theme: "<theme/initiative>"
    issues:
      - type: feature           # feature | story | bug | tech-debt | harness | eval
        area: frontend          # frontend | backend | fullstack | infra | docs | eval | harness
        title: "<issue title>"
        sprint: "2026-W24"      # optional time-box
        contract:
          productGoal: "<user value>"
          userStory: "As a <role>, I want <capability> so that <benefit>."
          scope:
            include: ["<in scope>"]
            exclude: ["<out of scope>"]
          acceptanceCriteria:
            - id: AC-001
              severity: blocker
              behavior: "<observable behaviour>"
              verification:
                method: playwright
                expected:
                  - "<concrete expectation>"
          redLines:
            - "<must never do>"
