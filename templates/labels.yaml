# Label taxonomy — the state machine, expressed as GitHub labels.
#
# On a GitHub-backed deployment these labels ARE the source of truth that the local
# store mirrors. status:* is a state machine (see src/domain/states.ts); type/area/
# agent/epic/sprint are orthogonal facets.

type:
  - type:roadmap
  - type:epic
  - type:feature
  - type:story
  - type:bug
  - type:tech-debt
  - type:harness   # improvements to the harness itself
  - type:eval      # improvements to the eval dataset / graders

status:            # the lifecycle (one at a time). 二段（ADR-0001 §5）。最終確定は M03。
  # epic（spec.md）ライフサイクル: オーサリング + 設計（issue 化前）
  - status:planned
  - status:ready-for-contract
  - status:contract-drafting     # 旧 contract-drafted（協業中の意。ADR §5）
  - status:contract-approved     # 人間署名（eval 合格の build-approved と区別）
  - status:designing             # M21 Design Planner 作業中
  - status:decomposed            # issue 群を spawn 済み
  # issue（work order）ライフサイクル: 投稿時に生成
  - status:ready-for-generation
  - status:generation-in-progress
  - status:ready-for-evaluation
  - status:evaluation-in-progress
  - status:changes-requested
  - status:needs-human-review   # escape hatch, reachable from anywhere（層別差し戻し: D17）
  - status:build-approved        # 旧 approved（eval 合格。ADR §5 改名）
  - status:ready-to-release      # 旧 ready-to-merge（人間リリースゲート明示。ADR §5 改名）
  - status:released

agent:
  - agent:planner
  - agent:design-planner   # M21（ADR-0001 D13）
  - agent:generator-claude
  - agent:generator-codex
  - agent:generator-gemini
  - agent:evaluator
  - agent:eval-curator

area:
  - area:frontend
  - area:backend
  - area:fullstack
  - area:eval
  - area:harness
  - area:docs
  - area:infra

# epic:E01, sprint:2026-W24 etc. are created on demand.
