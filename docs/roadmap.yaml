# ハーネス自身の roadmap（planning-tree 入力・roadmap-planner v2 出力契約）。
#
# `agentops plan-roadmap --seed docs/roadmap.yaml` → `agentops spawn-specs` で
# feature ごとの署名可能な要求契約 dir が docs/requirements/ に生える（旧 spec は
# docs/specs/ に凍結置台・2026-07-09 改名）。AC はここに書かない
# （to-spec で著述し人間が署名する — AC-PLAN-006）。
# 北極星: docs/NORTH_STAR.md（改善はプロダクトと同じ roadmap・同じ loop で回す）。

vision: "エージェント群が自律的に開発を行い、その開発プロセスを評価し、改善できる（NORTH_STAR の三能力）。"
principles:
  - "同じ種類の失敗を二度繰り返さない: 失敗は必ず回帰評価ケースへ捕捉する。"
  - "状態は store が単一の真実（ADR-0001）: resume・監査は状態だけから可能。"
  - "never-silent: 実行できない検証は理由付きで報告する。捏造も沈黙もしない。"

epics:
  - id: EPIC-01
    title: "Improvement loop operations"
    theme: "platform"
    outcome: "③改善ループの回帰資産が運用に耐える: 捕捉した失敗が target 切替や時間経過で死蔵されない。"
    features:
      - id: FEAT-001
        title: "Regression multi-target execution"
        outcome: "回帰 task が束縛 target とともに実行可能性（grader コマンド）も保持し、config.target がどこを向いていても、ディスク上に在る target の task は再検証され続ける（executedRate の頭打ち解消）。"
      - id: FEAT-002
        title: "Legacy task grader-command backfill"
        outcome: "FEAT-001 以前に捕捉された registry の legacy task（コマンド未捕捉）が、その target を現に採点している curate の機会に実行可能性を後付け獲得する。移行を手作業や re-curate の破壊なしに終わらせ、跨 target 実走を registry 全体へ波及させる。"
      - id: FEAT-003
        title: "Active-session liveness and late findings collection"
        outcome: "活動継続中（pane 変化あり）のレビュー/生成セッションが短い hardCap で timeout 扱いにならず（有限の絶対天井までは待つ）、stuck/timeout 判定後でも収集時点で存在する findings は捨てられない。⑤の grounded 失敗（1h26m の正当なミューテーション検証レビューが 10 分 cap で失われ人間介入を要した）を封じ、徹底レビューの証拠を評価ループへ回収する。"

  # M1「操舵の完備」（docs/NORTH_STAR_PLAN.md §3 — ギャップ A1/C2/C3/B3）
  - id: EPIC-02
    title: "Steering instruments and proposal lifecycle"
    theme: "platform"
    outcome: "北極星の操舵指標の全軸（特に自律軸＝HOW 介入）が計測され、Analyst の提案在庫が adopt/close の対で監査可能に循環する。"
    features:
      - id: FEAT-004
        title: "Autonomy-axis instruments (human HOW-intervention accounting)"
        outcome: "人間の HOW への介入（条件付き承認での実装持ち込み・repair への人手等）が store に事実として残り、status に issue あたり介入回数と HOW 非介入率が並ぶ。WHAT 確定・承認・審査は介入に数えない（判断点は消さない）。⑥⑦の条件付き承認 2 例が遡及して数えられる。"
      - id: FEAT-005
        title: "Proposal lifecycle: decline organ and analyst dedup hygiene"
        outcome: "adopt の対となる退役が監査可能な状態遷移として存在し（Issue の closed・EvalTask の retired・理由必須）、Analyst の dedup がルール同一性で効く（計器値の変動で在庫が複製されない）。⑧の処遇判断（NORTH_STAR_PLAN §4: ISSUE-0002/0008/0010・roman task 2 件）が store に適用され、R3 の再発火が止まる。"
      - id: FEAT-006
        title: "Production-wiring pin convention"
        outcome: "「テストに素通りされる inline 定数配線」クラス（⑥ major の一般化）が generator 規約と testQuality rubric で封じられ、既存の該当箇所（pollMs / maxConcurrent / panel 閾値等）が棚卸しでピン化される。"

  # M2「自律の横幅」（docs/NORTH_STAR_PLAN.md §3 — ギャップ A2/A3/A4）
  - id: EPIC-03
    title: "Autonomy breadth: dependency-ordered issues and parallel specs"
    theme: "platform"
    outcome: "「1 issue・1 spec 規模」の但し書きが消える: 依存を持つ複数 issue と複数 spec が人手なしで秩序立って drive される。"
    features:
      - id: FEAT-007
        title: "Dependency-ordered multi-issue drive"
        outcome: "dependsOnIssues が実行ガードで尊重され、1 spec から生えた依存チェーン（2+ issues）が依存順に自動 drive される。未 released の依存によるブロックは理由付きで可視（never-silent）。"
      - id: FEAT-008
        title: "Parallel spec execution with grounded skill authoring"
        outcome: "2 spec の issue 群が同時 in-flight でも tmux/worktree/コストが衝突せず完走する。その spec 著述自体を to-spec / to-detail-design skill の実走で行い、skill 本体の grounded 未検証（④⑤の operator 直接著述代替）を同時に解消する。"

  # D3「omnibus ゲート」（docs/NORTH_STAR_PLAN.md §2 横断 — ⑬ grounded 発見）
  - id: EPIC-04
    title: "Multi-issue acceptance integrity"
    theme: "platform"
    outcome: "複数 issue のグレーダ同時先置きの下でも受け入れゲートが issue 帰属を保ち、PR サイズ分解・帰属・並行の意義が omnibus 実装強制で崩れない。"
    features:
      - id: FEAT-009
        title: "Issue-scoped acceptance collection"
        outcome: "受け入れゲートの収集が駆動中 issue に scoped される: 複数 issue のグレーダを同時に先置きしても、各 build は自 issue の先置きガード（＋既存 baseline suite）だけを green にすれば通り、他 in-flight issue の先置きガードは活性化されない（⑬の grounded 失敗＝ISSUE-0019 が 0020/0021 の payload を背負った omnibus 実装強制の封じ込め）。活性化しなかったガードは理由付きで可視（never-silent）。released 済みガードの恒久昇格と全活性の baseline 検証は不変。"

  # M4 準備「外部 target 開発の成立」（docs/NORTH_STAR_PLAN.md §2 横断 D4 — ⑭人間確定の repo 分離モデル）
  - id: EPIC-05
    title: "External-target development enablement"
    theme: "platform"
    outcome: "テーマ repo（外部 target）が自分の WHAT（roadmap/requirements/_system）を所有したまま、上流チェーンが target の git と docs ツリーに対して成立する — 開発組織（この repo）と開発対象（テーマ repo）の接点が config.target に閉じる。"
    features:
      - id: FEAT-010
        title: "Target-rooted authoring"
        outcome: "spawn-specs / sign / spawn-issues / contract-draft の著述チェーンが、外部 target repo の docs/requirements・docs/_system・git に対して働く: spawn した要求 stub は target repo に生え、署名は target の git の committed blob を版固定し、design lint は target の system 層を解決する。harness 自身（repo='.'）への従来動作は不変（additive）。"

  # M4 安定化「外部 target を増やしても、状態と評価が嘘をつかない」
  - id: EPIC-06
    title: "Grounded runtime integrity"
    theme: "platform"
    outcome: "外部 target の自律開発を反復しても、組織 store の計画状態が別 target と混線せず、read-only reviewer の環境準備が偽の escalation を生まない。"
    features:
      - id: FEAT-011
        title: "Store-target binding integrity"
        outcome: "1つの組織 store は1つの target repo に耐久的に束縛され、異なる target を向いた状態変更操作は書込み前に理由付きで拒否される。self-hosting と外部 target の往復は別 store に構造分離され、D5 の roadmap/epic 混線が再発しない。"
      - id: FEAT-012
        title: "Read-only reviewer workspace integrity"
        outcome: "reviewer が依存関係の確認やテストを行っても評価対象 checkout を変更せず、lockfile 等への書込み事故で健全な review evidence が失われて needs-human-review になる D6 の false-escalation が再発しない。"

  # A5「tool/model を役割・観点ごとに選べるモデル非依存ランタイム」
  - id: EPIC-07
    title: "Model-neutral agent runtime"
    theme: "platform"
    outcome: "planning・generation・review の各呼出しが tool/model 非依存の契約を通り、役割・観点ごとに異なる provider を選んでも同じ決定論オーケストレーション、監査、評価が成立する。"
    features:
      - id: FEAT-013
        title: "Agent invocation identity and provenance"
        outcome: "全 role session が role・perspective・provider・model・prompt・outcome を共通の invocation identity で耐久記録し、どのエージェントが何を生成・採点したかを metrics と監査から正しく辿れる。"
      - id: FEAT-014
        title: "Provider-neutral interactive session backend"
        outcome: "tmux の対話・sentinel・liveness 契約を保ったまま、Claude Code/Codex 等の起動差を provider adapter の内側へ閉じ、execution は特定 CLI のコマンド形に依存しない。"
      - id: FEAT-015
        title: "Role and perspective agent routing"
        outcome: "generator/planning と各 review perspective に (provider, model) を決定論的に割り当て、未設定時の既定・無効 route の fail-closed・再実行時の同一 route が監査可能に成立する。"

  # ADR-0008 / D7「theme repo の GitHub Issue を人間の入口にする」
  - id: EPIC-08
    title: "GitHub Issue development intake"
    theme: "platform"
    outcome: "人間が theme repo で ready にした GitHub Issue が、原文の WHAT と帰属を失わず planning を経て store queue へ入り、既存 drive/panel/GitHub PR gate まで HOW 介入なしで進む。"
    features:
      - id: FEAT-016
        title: "Idempotent GitHub Issue polling and claim"
        outcome: "明示的に ready な GitHub Issue を決定論 watcher が発見・一度だけ claim し、repository＋issue identity・原文 snapshot・状態を store に残す。重複 poll や再起動は二重取込を生まない。"
      - id: FEAT-017
        title: "Traceable planning enrichment gate"
        outcome: "planning-agent が粗い WHAT を1..N個の Issue Contract 候補へ整え、全ACを原文またはsystem要素へtraceする。曖昧さや根拠のない scope 追加は推測せず needs-human-review へ止める。"
      - id: FEAT-018
        title: "GitHub Issue-to-PR grounded vertical slice"
        outcome: "実remote上の ready Issue が watcher→planning→store→guard→drive→異種provider panel→GitHub PR まで進み、再起動を挟んでも重複せず、HOW介入0と証拠付き判定を計器で示す。"

  # A6「unit_test以外のACも宣言methodそのものでgroundする」
  - id: EPIC-09
    title: "Grounded verification breadth"
    theme: "quality"
    outcome: "UI/API/DB/security等の受け入れ基準がunit testへの読み替えや暗黙passをせず、宣言したverification methodの実commandと証拠で評価・回帰できる。"
    features:
      - id: FEAT-019
        title: "Verification-method grader command registry"
        outcome: "targetごとのverification method→command registryを用い、各ACを独立した環境でgroundする。未設定methodはfail-closed、実行結果はartifact evidenceへ残り、Curator/Regressionも同じcaptured commandを再利用する。"

  # A7「UI要求を専用設計コンテキストでHOW化し、generic実装へ契約として渡す」
  - id: EPIC-10
    title: "UI design authoring readiness"
    theme: "product-design"
    outcome: "UIを含むWHATが専用UI/UXコンテキストでtoken/component/a11y契約へ著述・検証され、その根拠を実装とレビューが共有する。設計不能時はgeneric generatorへ流れない。"
    features:
      - id: FEAT-020
        title: "Conditional UI-design readiness gate"
        outcome: "planning candidateがfrontend/fullstackなら検証済みUI design artifactを要求し、不在・曖昧・不正なら理由付きneeds-human-reviewで全件停止する。backend intakeと既存trace/idempotenceは不変。"
      - id: FEAT-021
        title: "Dedicated UI design authoring agent"
        outcome: "frontend/fullstack candidateごとに独立route/contextのUI designerがdesign principles・tokens・components・states/interactions・accessibilityをACへtraceしたartifactとして著述する。provenance検証後だけIssueへ投影し、generatorとreviewerが同じ契約を参照する。"

  # D8「PRを実際の自動レビュー・修正・配送ループにする」
  - id: EPIC-11
    title: "PR-native autonomous review and delivery"
    theme: "platform"
    outcome: "PRのcurrent head revisionを複数観点で評価し、blocking findingを同branchへ修正pushして再レビューし、全ゲート通過時だけ自動mergeして次taskへ進む。"
    features:
      - id: FEAT-022
        title: "PR revision identity and stale-approval invalidation"
        outcome: "PR head SHAをrevision identityとしてEvalRun・Invocation・review/checkへ束縛し、head更新で旧承認をmerge資格から除外する。"
      - id: FEAT-023
        title: "PR-native review and repair loop"
        outcome: "PR作成後のcurrent headを独立Perspective sessionがレビューし、P0/P1/blocker/request_changesをRepair Briefへ集約して同branchを修正、fresh headを全観点で再評価する。"
      - id: FEAT-024
        title: "Atomic automatic merge and queue continuation"
        outcome: "current headの全観点・checks・threads・mergeabilityをmerge直前に再検証し、expected SHA付きで自動merge、released・Source Issue集約close・依存解除・次taskを同一watch loopで進める。"

  # D9「Webhook即時trigger＋poll reconciliation＋複数repo GUI」
  - id: EPIC-12
    title: "Event-driven multi-repository control plane"
    theme: "platform"
    outcome: "Issue/PR/review/checkイベントがdurable inboxから複数repoへ安全にrouteされ、GUIでrepo・consumer・deliveryを管理でき、pollが取りこぼしを回収する。"
    features:
      - id: FEAT-025
        title: "Durable GitHub webhook inbox and normalized routing"
        outcome: "deliveryをACK前に耐久保存・delivery IDでdedupし、registered repoの許可eventだけをtransport非依存eventとしてconsumerへrouteする。"
      - id: FEAT-026
        title: "Multi-repository local forwarder and runtime adapters"
        outcome: "複数repoのgh webhook forwarderをregistrationから監督し、Octolink固有Orca同期とAgentOpsを列挙consumer adapterとしてOS非依存coreへ接続する。"
      - id: FEAT-027
        title: "Local webhook control GUI"
        outcome: "loopback GUIでrepository追加・events/consumer設定・forwarder health・delivery履歴/失敗理由/再実行を管理でき、任意command実行面を作らない。"
