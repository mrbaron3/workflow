# Idempotent GitHub Issue polling and claim — 受け入れ検証

dependsOn:
  - DOM-intake-001
  - DOM-intake-004
  - DOM-intake-005
  - DOM-intake-006
  - DOM-intake-007
  - DOM-intake-008
  - ARCH-intake-001
  - ARCH-intake-002
  - ARCH-intake-003
  - ARCH-intake-004
  - DATA-intake-001
  - DATA-intake-002
  - DATA-intake-003
